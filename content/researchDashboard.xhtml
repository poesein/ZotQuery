<?xml version="1.0"?>
<?xml-stylesheet href="chrome://global/skin/global.css" type="text/css"?>
<?xml-stylesheet href="chrome://zotero/skin/zotero.css" type="text/css"?>
<window id="zotseek-lne-research-dashboard"
        title="ZotQuery"
        orient="vertical"
        width="980" height="720"
        xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
        xmlns:html="http://www.w3.org/1999/xhtml">
  <html:style><![CDATA[
    :root { --accent:#356ae6; --good:#238636; --warn:#b26a00; --bad:#c62828; }
    #dashboard { padding:18px; gap:14px; background:var(--material-background,#fff); color:var(--fill-primary,#222); }
    .hero { display:flex; align-items:center; gap:14px; padding:16px; border-radius:10px; background:linear-gradient(135deg,rgba(53,106,230,.16),rgba(74,179,148,.12)); }
    .mark { width:44px; height:44px; border-radius:11px; display:grid; place-items:center; color:#fff; background:var(--accent); font-weight:800; font-size:16px; }
    .title { font-size:21px; font-weight:700; }
    .subtitle { margin-top:3px; opacity:.72; font-size:12px; }
    .grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:9px; }
    .card { padding:11px; border:1px solid var(--material-border,#ddd); border-radius:8px; background:var(--material-sidepane,#fafafa); }
    .metric { margin-top:4px; font-size:17px; font-weight:700; overflow-wrap:anywhere; }
    .label { font-size:11px; opacity:.7; }
    .query-panel { padding:14px; border:1px solid var(--material-border,#ddd); border-radius:9px; }
    #research-query { width:100%; box-sizing:border-box; padding:9px 11px; font-size:14px; border:1px solid var(--material-border,#bbb); border-radius:6px; background:var(--material-background,#fff); color:inherit; }
    .actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; align-items:center; }
    button.primary { font-weight:700; }
    #output { flex:1; min-height:220px; overflow:auto; white-space:pre-wrap; padding:13px; border:1px solid var(--material-border,#ddd); border-radius:8px; background:var(--material-sidepane,#fafafa); font:12px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace; }
    .status-ok { color:var(--good); } .status-bad { color:var(--bad); }
    @media (prefers-color-scheme:dark) { :root { --accent:#78a0ff; --good:#72d67f; --bad:#ff8585; } }
  ]]></html:style>

  <script><![CDATA[
    "use strict";
    const Z = window.opener?.Zotero || Zotero;
    const byId = id => document.getElementById(id);
    const set = (id, value) => { const el=byId(id); if(el) el.textContent=String(value ?? "-"); };
    const output = value => { byId("output").textContent = typeof value === "string" ? value : JSON.stringify(value,null,2); };
    const busy = (button, state, text) => { button.disabled=state; if(text) button.setAttribute("label",text); };

    async function refreshHealth() {
      try {
        const h=await Z.ZotQueryResearchUI.health();
        set("metric-health",h.ok?"正常":"需处理");
        byId("metric-health").className=`metric ${h.ok?"status-ok":"status-bad"}`;
        set("metric-pdf",`${h.search?.indexedPapers||0}/${h.search?.totalPapers||0}`);
        set("metric-notes",h.lne?.notes||0);
        set("metric-vectors",`${h.lne?.semantic?.vectors||0}/${h.lne?.semantic?.totalUniqueSegments||0}`);
        set("metric-model",h.embeddingContract?.pdfModelId||"未配置");
        set("metric-contract",h.embeddingContract?.sameModel?"PDF = Note":"模型不一致");
        return h;
      } catch(e) { set("metric-health",`失败`); output(e?.message||String(e)); }
    }

    function conciseFind(result) {
      return {
        query:result.query, mode:result.mode, queryPlan:result.queryPlan,
        returned:result.notes?.length||0, truncation:result.truncation,
        notes:(result.notes||[]).map(n=>({noteKey:n.noteKey,title:n.title,doi:n.doi,year:n.year,tier:n.tier,score:n.score,tagCounts:n.tagCounts,hits:(n.hits||[]).map(h=>({line:h.line,tag:h.tag,section:h.section,quote:h.quote}))}))
      };
    }

    async function quickFind(event) {
      const q=byId("research-query").value.trim(); if(!q) return;
      const b=event.currentTarget; busy(b,true,"检索中…"); output("正在检索 Zotero 阅读笔记…");
      try { output(conciseFind(await Z.ZotQueryLNE.api.find(q,{top:20,hits:3}))); }
      catch(e) { output(`检索失败：${e?.message||e}`); }
      finally { busy(b,false,"快速查找笔记"); }
    }

    async function startResearch(event) {
      const q=byId("research-query").value.trim(); if(!q) return;
      const b=event.currentTarget; busy(b,true,"创建中…"); output("正在创建统一 PDF + Note 研究会话…");
      try {
        const exact=byId("exact-mode").checked;
        const r=await Z.ZotQueryResearch.startOrchestratedResearch({question:q,questionMode:exact?"EXACT":"AUTO",surveyPreset:"balanced",surveyLexicalOnly:false,promotionLimit:5});
        output({sessionId:r.sessionId,surveyId:r.surveyId,questionMode:r.sweep?.questionMode,factRequest:r.sweep?.factRequest,coverage:r.sweep?.coverage,surveyTotals:r.survey?.totals,promotion:r.promotion,workflow:r.workflow});
      } catch(e) { output(`创建失败：${e?.message||e}`); }
      finally { busy(b,false,"创建证据研究会话"); }
    }

    async function syncNotes(event) {
      const b=event.currentTarget; busy(b,true,"同步中…"); output("正在同步 Zotero Notes 与共享向量…");
      try { output(await Z.ZotQueryResearchUI.syncNotes()); await refreshHealth(); }
      catch(e) { output(`同步失败：${e?.message||e}`); }
      finally { busy(b,false,"同步笔记与向量"); }
    }

    function setResearchQuery(q){byId("research-query").value=String(q||"");}
    window.setResearchQuery=setResearchQuery;
    window.addEventListener("DOMContentLoaded",()=>{
      const q=window.arguments?.[0]?.query||""; setResearchQuery(q);
      byId("quick-find").addEventListener("command",quickFind);
      byId("start-research").addEventListener("command",startResearch);
      byId("sync-notes").addEventListener("command",syncNotes);
      byId("refresh-health").addEventListener("command",async()=>output(await refreshHealth()));
      refreshHealth();
    },{once:true});
  ]]></script>

  <vbox id="dashboard" flex="1">
    <html:div class="hero">
      <html:div class="mark">LNE</html:div>
      <html:div>
        <html:div class="title">ZotQuery</html:div>
        <html:div class="subtitle">PDF 原文检索 · Zotero Note 导航 · Survey · Evidence Gate · Unified MCP</html:div>
      </html:div>
    </html:div>

    <html:div class="grid">
      <html:div class="card"><html:div class="label">系统状态</html:div><html:div id="metric-health" class="metric">检查中…</html:div></html:div>
      <html:div class="card"><html:div class="label">PDF 索引</html:div><html:div id="metric-pdf" class="metric">-</html:div></html:div>
      <html:div class="card"><html:div class="label">阅读笔记</html:div><html:div id="metric-notes" class="metric">-</html:div></html:div>
      <html:div class="card"><html:div class="label">Note 向量覆盖</html:div><html:div id="metric-vectors" class="metric">-</html:div></html:div>
      <html:div class="card" style="grid-column:span 3"><html:div class="label">共享向量模型</html:div><html:div id="metric-model" class="metric">-</html:div></html:div>
      <html:div class="card"><html:div class="label">模型合同</html:div><html:div id="metric-contract" class="metric">-</html:div></html:div>
    </html:div>

    <html:div class="query-panel">
      <html:input id="research-query" type="text" placeholder="输入研究问题；Unicode 标识符及其字符顺序将原样保留…"/>
      <html:div class="actions">
        <button id="quick-find" class="primary" label="快速查找笔记"/>
        <button id="start-research" class="primary" label="创建证据研究会话"/>
        <checkbox id="exact-mode" label="EXACT：必须由 PDF FactRecord 闭合" checked="true"/>
        <spacer flex="1"/>
        <button id="sync-notes" label="同步笔记与向量"/>
        <button id="refresh-health" label="刷新状态"/>
      </html:div>
    </html:div>

    <html:pre id="output">结果和审计信息将在这里显示。笔记只用于导航；精确事实必须回到同父 PDF。</html:pre>
  </vbox>
</window>
